services:
  - type: web
    name: aquaculture-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run db:generate -w @aquaculture/api && npm run build -w @aquaculture/api
    preDeployCommand: npm run db:migrate:deploy -w @aquaculture/api
    startCommand: npm run start -w @aquaculture/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aquaculture-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false

  - type: web
    name: aquaculture-web
    runtime: static
    buildCommand: npm ci && npm run build -w @aquaculture/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: aquaculture-db
    plan: free
