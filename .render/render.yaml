services:
  - type: web
    name: aquaculture-api
    env: node
    # Render will run this build command to prepare the service
    buildCommand: npm ci && npm run db:generate -w @aquaculture/api && npm run build -w @aquaculture/api
    startCommand: npm run db:migrate:deploy -w @aquaculture/api && npm run start -w @aquaculture/api
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aquaculture-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false

  - type: web
    name: aquaculture-web
    env: static
    buildCommand: npm ci && npm run build -w @aquaculture/web
    staticPublishPath: apps/web/dist
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: aquaculture-db
    plan: starter
    type: postgresql
