services:
  - type: web
    name: aquaculture-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate -w @aquaculture/api && npm run build -w @aquaculture/api
    startCommand: npm run db:migrate:deploy -w @aquaculture/api && npm run start -w @aquaculture/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
