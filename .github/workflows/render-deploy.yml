name: CI & Deploy to Render

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build -w @aquaculture/api

      - name: Build Web
        run: npm run build -w @aquaculture/web

      - name: Trigger Render deploy (API)
        if: ${{ secrets.RENDER_SERVICE_ID_API && secrets.RENDER_API_KEY }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_API: ${{ secrets.RENDER_SERVICE_ID_API }}
        run: |
          echo "Triggering deploy for API service $RENDER_SERVICE_ID_API"
          curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID_API/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":true}' || true

      - name: Trigger Render deploy (Web)
        if: ${{ secrets.RENDER_SERVICE_ID_WEB && secrets.RENDER_API_KEY }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_WEB: ${{ secrets.RENDER_SERVICE_ID_WEB }}
        run: |
          echo "Triggering deploy for Web service $RENDER_SERVICE_ID_WEB"
          curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID_WEB/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":true}' || true
